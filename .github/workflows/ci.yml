name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Docs-only changes (Markdown, LICENSE, issue and discussion templates,
  # images and pages under docs/) skip the jobs below. They are skipped with a
  # job-level `if`, not paths-ignore, so required checks still pass.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi
          # No usable base (manual run, new branch, rewritten history): build.
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only "$base" HEAD)
          echo "Changed files:"
          echo "$changed"
          docs='^(.*\.md|LICENSE.*|\.github/(ISSUE_TEMPLATE|DISCUSSION_TEMPLATE)/.*|docs/.*\.(svg|png|jpe?g|gif|webp|ico|html|css))$'
          keep='^LICENSE$'
          code_files=$( { echo "$changed" | grep -vE "$docs"; [ -n "$keep" ] && echo "$changed" | grep -E "$keep"; } | grep -c . || true)
          if [ "$code_files" -gt 0 ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "Docs-only change: skipping the build and test jobs."
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  analyze-test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          # Pinned to the version on the dev machine. An unpinned beta pulled
          # in 3.47, which deprecates package:flutter/material.dart, and the
          # analyzer treats those infos as errors. Bump this deliberately.
          channel: beta
          flutter-version: 3.46.0-0.3.pre
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  # Builds the installer on every PR, not just on release tags. A packaging
  # break that only surfaces when a tag is pushed is a break found at the worst
  # possible moment, so the release path is exercised continuously instead.
  windows-installer:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          # Pinned to the version on the dev machine. An unpinned beta pulled
          # in 3.47, which deprecates package:flutter/material.dart, and the
          # analyzer treats those infos as errors. Bump this deliberately.
          channel: beta
          flutter-version: 3.46.0-0.3.pre
      - run: flutter pub get
      - run: flutter build windows --release
      - name: Compile the installer
        shell: pwsh
        run: ./installer/build-installer.ps1 -Version 0.0.0-ci
      - uses: actions/upload-artifact@v4
        with:
          name: triliage-windows-installer
          path: dist/*.exe
          if-no-files-found: error
