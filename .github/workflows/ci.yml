name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  analyze-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: beta
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  # Builds the installer on every PR, not just on release tags. A packaging
  # break that only surfaces when a tag is pushed is a break found at the worst
  # possible moment, so the release path is exercised continuously instead.
  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: beta
      - run: flutter pub get
      - run: flutter build windows --release
      - name: Compile the installer
        shell: pwsh
        run: ./installer/build-installer.ps1 -Version 0.0.0-ci
      - uses: actions/upload-artifact@v4
        with:
          name: triliage-windows-installer
          path: dist/*.exe
          if-no-files-found: error
